[project]
name = "voice-register-backend"
version = "0.1.0"
description = "FastAPI backend for Cliniko tool APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
start = "uvicorn app.main:app --reload"
